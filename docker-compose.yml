services:
  main-agent:
    build:
      context: .
      dockerfile: docker/Dockerfile.main
    container_name: main-agent
    env_file:
      - ./.env
    volumes:
      - ./data:/app/data
      - ./src:/app/src
    depends_on:
      - research-agent
    environment:
      TWITTER_SCOUT_WORKER_ENABLED: "false"
      TWITTER_SCOUT_NOTIFY_FORCE_REFRESH: "false"
      PROFILE_ANALYZER_WORKER_ENABLED: "false"
    restart: unless-stopped

  profile-analyzer-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.main
    container_name: profile-analyzer-worker
    env_file:
      - ./.env
    environment:
      PROFILE_ANALYZER_ENABLED: "true"
      PROFILE_ANALYZER_WORKER_ENABLED: "true"
      PROFILE_ANALYZER_SAMPLE_LIMIT: "400"
      PROFILE_ANALYZER_PROFILE_OUTPUT_PATH: ./data/profiles/generated_profile.md
      TWITTER_SCOUT_PROFILE_PATH: ./data/profiles/generated_profile.md
    volumes:
      - ./data:/app/data
      - ./src:/app/src
    depends_on:
      - main-agent
    command: ["python", "-m", "main_agent.workers.profile_analyzer_worker"]
    restart: unless-stopped

  twitter-scout-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.main
    container_name: twitter-scout-worker
    env_file:
      - ./.env
    environment:
      TWITTER_SCOUT_ENABLED: "true"
      TWITTER_SCOUT_WORKER_ENABLED: "true"
      TWITTER_SCOUT_NOTIFY_FORCE_REFRESH: "false"
      TWITTER_SCOUT_PROFILE_PATH: ./data/profiles/generated_profile.md
    volumes:
      - ./data:/app/data
      - ./src:/app/src
    depends_on:
      - profile-analyzer-worker
    command: ["python", "-m", "main_agent.workers.twitter_scout_worker"]
    restart: unless-stopped

  research-agent:
    build:
      context: .
      dockerfile: docker/Dockerfile.research
    container_name: research-agent
    env_file:
      - ./.env
    volumes:
      - ./data/runtime:/app/data/runtime
      - ./data/audit:/app/data/audit
      - ./src:/app/src
    restart: unless-stopped
